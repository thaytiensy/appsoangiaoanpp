<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ART AI - Thầy Giáo Mĩ Thuật Dạy Học (Lớp 1-5)</title>
    <!-- PWA Meta Tags & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/teacher.jpg" />
    <link rel="apple-touch-icon" href="/teacher.jpg" />
    <meta name="theme-color" content="#e11d48" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ART AI Thầy Cọ Nhí" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              kids: ['Nunito', 'sans-serif'],
            },
            colors: {
              kidYellow: '#FDE047',
              kidOrange: '#FB923C',
              kidPink: '#F472B6',
              kidBlue: '#38BDF8',
              kidGreen: '#4ADE80',
              kidPurple: '#C084FC',
            },
            keyframes: {
              bounceGentle: {
                '0%, 100%': { transform: 'translateY(-4%)' },
                '50%': { transform: 'translateY(0)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              }
            },
            animation: {
              'bounce-gentle': 'bounceGentle 2s infinite ease-in-out',
              'wiggle': 'wiggle 1s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Nunito', sans-serif;
        user-select: none;
      }
      /* Custom kid-friendly scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf2f8;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb {
        background: #f472b6;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ec4899;
      }
    </style>
    <!-- Auto-Update & Cache Purge Engine -->
    <script>
      (function() {
        const CURRENT_APP_BUILD = '3.0.0-smas-viettel-powerpoint-word-excel';
        const previousBuild = localStorage.getItem('ARTED_APP_BUILD_ID');
        if (previousBuild !== CURRENT_APP_BUILD) {
          localStorage.setItem('ARTED_APP_BUILD_ID', CURRENT_APP_BUILD);
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                caches.delete(name);
              });
            });
          }
        }

        // Global recovery if a dynamic chunk fails to load due to stale cache
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('Unexpected token') !== -1 || e.message.indexOf('Failed to fetch') !== -1)) {
            console.warn('Phát hiện lỗi nạp module phiên bản cũ, đang tự động làm mới...');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            if (!sessionStorage.getItem('reloaded_for_chunk_error')) {
              sessionStorage.setItem('reloaded_for_chunk_error', 'true');
              window.location.reload();
            }
          }
        });

        // Anti-Blank Screen Watchdog: If #root is still completely empty after 2.5s, render a recovery prompt
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            const root = document.getElementById('root');
            if (root && root.children.length === 0) {
              root.innerHTML = `
                <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Nunito, sans-serif; padding: 20px; text-align: center;">
                  <div style="background: white; padding: 32px; border-radius: 28px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); max-width: 500px; border: 3px solid #fde68a;">
                    <div style="font-size: 54px; margin-bottom: 12px;">🎨</div>
                    <h2 style="font-size: 22px; font-weight: 900; color: #e11d48; margin: 0 0 10px 0;">
                      ART AI: Sẵn Sàng Bản Cập Nhật Mới!
                    </h2>
                    <p style="font-size: 14px; color: #4b5563; line-height: 1.6; margin-bottom: 24px;">
                      Hệ thống vừa tích hợp bộ học liệu số <b>PowerPoint, Word, Excel chuẩn SMAS Viettel</b> và <b>Giọng Cô Hoài My</b>. Bấm nút dưới để nạp giao diện mới nhất:
                    </p>
                    <button id="btn-force-reload" style="background: linear-gradient(to right, #f43f5e, #fb923c); color: white; border: none; padding: 14px 28px; border-radius: 18px; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3);">
                      🚀 Tải Lại Ngay Phiên Bản Mới
                    </button>
                  </div>
                </div>
              `;
              const btn = document.getElementById('btn-force-reload');
              if (btn) {
                btn.onclick = function() {
                  localStorage.removeItem('ARTED_APP_BUILD_ID');
                  sessionStorage.clear();
                  if ('caches' in window) {
                    caches.keys().then(function(names) {
                      Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                        window.location.reload(true);
                      });
                    });
                  } else {
                    window.location.reload(true);
                  }
                };
              }
            }
          }, 2500);
        });
      })();
    </script>
  </head>
  <body class="bg-gradient-to-br from-amber-50 via-pink-50 to-sky-50 text-gray-800 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Register PWA Service Worker with Auto-Update Mechanism -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('PWA Service Worker registered:', reg.scope);
            reg.update();
          }).catch((err) => {
            console.log('PWA SW registration non-fatal:', err);
          });
        });
      }
    </script>
  </body>
</html>
